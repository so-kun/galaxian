<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Galaxian</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0 0 22px 0;
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        background: #000;
      }
      #help {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6b7075;
        font: 500 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.04em;
        white-space: nowrap;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="screen"></canvas></div>
    <div id="help">5/C=COIN &middot; 1/2=START &middot; &larr;&rarr;/AD=MOVE &middot; SPACE/Z=FIRE &middot; TAP=COIN+START</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
